<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Smartcoder</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #172337;
        }

        .navbar-brand {
            font-weight: bold;
            color: white;
        }

        .edit-card {
            max-width: 650px;
            margin: 60px auto;
            padding: 35px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .btn-primary {
            background-color: #4059d6;
            border: none;
            padding: 12px;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background-color: #3048bd;
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">
                Victor245
            </a>

            <a href="{{ url_for('students') }}"
               class="btn btn-light btn-sm">
                View Students
            </a>
        </div>
    </nav>


    <!-- Edit Student Form -->
    <div class="container">

        <div class="edit-card">

            <h2 class="text-center fw-bold mb-2">
                Edit Student Details
            </h2>

            <p class="text-center text-muted mb-4">
                Update the student's registration information
            </p>

            <form method="POST">

                <!-- Registration Number -->
                <div class="mb-3">
                    <label class="form-label">Registration Number</label>
                    <input type="text"
                           class="form-control"
                           value="{{ student.reg_number }}"
                           readonly>
                </div>

                <!-- Full Name -->
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text"
                           name="fullname"
                           class="form-control"
                           value="{{ student.fullname }}"
                           required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ student.email }}"
                           required>
                </div>

                <!-- Course and Department -->
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Course</label>
                        <input type="text"
                               name="course"
                               class="form-control"
                               value="{{ student.course }}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Department</label>
                        <input type="text"
                               name="department"
                               class="form-control"
                               value="{{ student.department }}"
                               required>
                    </div>

                </div>

                <!-- Buttons -->
                <div class="d-grid gap-2 mt-3">

                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="{{ url_for('students') }}"
                       class="btn btn-light">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
