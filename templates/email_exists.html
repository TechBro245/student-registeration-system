{% extends "base.html" %}
{% block title %}Email Exists{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-5 text-center">
      <div class="mx-auto mb-3 d-flex justify-content-center align-items-center rounded-circle" style="width:72px;height:72px;background:#fef2f2;color:#ef4444;font-size:32px;">!</div>
      <h3 class="fw-bold">Email Already Used</h3>
      <p class="text-muted">The email <b style="color:#ef4444;">{{ email }}</b> has already been registered.</p>
      <p class="text-muted small">Please use a different email address.</p>
      <div class="d-grid gap-2 mt-4">
        <a href="/" class="btn btn-primary">Try Again</a>
        <a href="/students" class="btn btn-light">View Students</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
