<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Smartcoder{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f5f7fb;font-family: 'Segoe UI', sans-serif;}
        .navbar{background:#1e293b !important;}
        .card{border:none;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.08);}
        .btn-primary{background:#6366f1;border:none;border-radius:10px;padding:11px;}
        .btn-primary:hover{background:#4f46e5;}
        .form-control, .form-select{border-radius:10px;padding:11px 14px;}
        .form-control:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,0.15);}
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Victor245</a>
            <a class="btn btn-sm btn-light" href="/students">View Students</a>
        </div>
    </nav>
<div class="container py-5">
{% block content %}{% endblock %}
</div>
</body>
</html>
