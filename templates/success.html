{% extends "base.html" %}
{% block title %}Success{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-5 text-center">
      <div class="mx-auto mb-3 d-flex justify-content-center align-items-center rounded-circle" style="width:72px;height:72px;background:#ecfdf5;color:#10b981;font-size:32px;">✓</div>
      <h3 class="fw-bold">Registration Successful!</h3>
      <p class="text-muted">Congratulations, <b style="color:#6366f1;">{{ fullname }}</b>! Your registration has been received.</p>
      <div class="d-grid gap-2 mt-4">
        <a href="/" class="btn btn-primary">Register another student</a>
        <a href="/students" class="btn btn-light">View all students</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
