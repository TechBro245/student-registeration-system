{% extends "base.html" %}
{% block title %}Register - Smartcoder{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card p-4 p-md-5">
      <h3 class="fw-bold mb-1">Student Registration</h3>
      <p class="text-muted mb-4">Join Smartcoder Institute today</p>
      
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Fullname</label>
          <input type="text" name="fullname" class="form-control" placeholder="Sani Musa" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" placeholder="sani@example.com" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Course</label>
            <select name="course" class="form-select" required>
              <option value="">Select course</option>
              <option value="python">Python Development</option>
              <option value="web">Web Development</option>
              <option value="data">Data Analytics</option>
              <option value="cyber">Cyber Security</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Department</label>
            <input type="text" name="department" class="form-control" placeholder="e.g. Computer Science" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">Create Registration</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
